name: Validate Kubernetes Manifests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-manifests:
    name: Lint and Validate K8s/Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Helm lint
        run: helm lint ./charts/tripplanner

      - name: Helm template render check
        run: |
          helm template tripplanner ./charts/tripplanner > /dev/null

      - name: Validate K8s manifests with kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

          if [ -d "k8s" ]; then
            kubeconform -summary k8s/
          fi

          helm template tripplanner ./charts/tripplanner | kubeconform -summary