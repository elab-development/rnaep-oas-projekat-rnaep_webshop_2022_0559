apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: tripplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-service
  template:
    metadata:
      labels:
        app: trip-service
    spec:
      containers:
      - name: trip-service
        image: tea17/trip-service:1.0
        ports:
        - containerPort: 3003
        envFrom:
        - configMapRef:
            name: app-config
        env:
        - name: TRIP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TRIP_DB_PASSWORD
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TRIP_JWT_SECRET
        - name: WEATHER_API_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: WEATHER_API_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 5