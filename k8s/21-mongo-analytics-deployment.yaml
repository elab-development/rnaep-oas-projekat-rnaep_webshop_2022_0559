apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-analytics
  namespace: tripplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-analytics
  template:
    metadata:
      labels:
        app: mongo-analytics
    spec:
      containers:
      - name: mongo-analytics
        image: mongo:7
        ports:
        - containerPort: 27017
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "300m"
        volumeMounts:
        - name: mongo-analytics-data
          mountPath: /data/db
      volumes:
      - name: mongo-analytics-data
        emptyDir: {}