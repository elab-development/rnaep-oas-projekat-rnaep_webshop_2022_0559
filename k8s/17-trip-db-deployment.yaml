apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-db
  namespace: tripplanner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trip-db
  template:
    metadata:
      labels:
        app: trip-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
        - containerPort: 3306
        env:
        - name: MYSQL_DATABASE
          value: trip_db
        - name: MYSQL_USER
          value: trip_user
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TRIP_DB_PASSWORD
        - name: MYSQL_ROOT_PASSWORD
          value: "root_password_demo"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: trip-db-data
          mountPath: /var/lib/mysql
      volumes:
      - name: trip-db-data
        emptyDir: {}