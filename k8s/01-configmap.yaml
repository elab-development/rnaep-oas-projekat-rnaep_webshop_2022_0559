apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tripplanner
data:
  AUTH_PORT: "3001"
  AUTH_DB_HOST: "mysql-auth"
  AUTH_DB_PORT: "3306"
  AUTH_DB_NAME: "auth_db"
  AUTH_DB_USER: "auth_user"
  JWT_EXPIRES_IN: "1h"

  GATEWAY_PORT: "8080"
  FRONTEND_URL: "http://frontend:80"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  CATALOG_SERVICE_URL: "http://catalog-service:3002"
  TRIP_SERVICE_URL: "http://trip-service:3003"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3004"

  FRONTEND_PORT: "80"

  CATALOG_PORT: "3002"
  MONGO_CATALOG_URI: "mongodb://mongo-catalog:27017/catalog_db"
  NOMINATIM_BASE_URL: "https://nominatim.openstreetmap.org"

  TRIP_PORT: "3003"
  TRIP_DB_HOST: "trip-db"
  TRIP_DB_PORT: "3306"
  TRIP_DB_NAME: "trip_db"
  TRIP_DB_USER: "trip_user"
  KAFKA_BROKERS: "kafka:19092"
  WEATHER_API_URL: "https://api.openweathermap.org"

  ANALYTICS_PORT: "3004"
  MONGO_ANALYTICS_URI: "mongodb://mongo-analytics:27017/analytics_db"
  KAFKA_BROKER: "kafka:19092"
  KAFKA_GROUP_ID: "analytics-service-group"