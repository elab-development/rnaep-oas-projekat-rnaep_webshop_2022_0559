apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: tripplanner
data:
  AUTH_PORT: "3001"
  AUTH_DB_HOST: "mysql-auth"
  AUTH_DB_PORT: "3306"
  AUTH_DB_NAME: "auth_db"
  AUTH_DB_USER: "auth_user"
  JWT_EXPIRES_IN: "1h"
  
  GATEWAY_PORT: "8080"
  AUTH_SERVICE_URL: "http://auth-service:3001"
  CATALOG_SERVICE_URL: "http://catalog-service:3002"
  TRIP_SERVICE_URL: "http://trip-service:3003"
  ANALYTICS_SERVICE_URL: "http://analytics-service:3004"
  
  FRONTEND_PORT: "80"