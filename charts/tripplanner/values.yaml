namespace: tripplanner

imagePullPolicy: IfNotPresent

auth:
  image: tea17/auth-service
  tag: "1.0"
  replicas: 2
  port: 3001

apiGateway:
  image: tea17/api-gateway
  tag: "1.0"
  replicas: 1
  port: 8080

frontend:
  image: tea17/frontend
  tag: "1.0"
  replicas: 1
  port: 80

mysql:
  image: mysql
  tag: "8.0"
  port: 3306

secrets:
  authDbPassword: "auth_password"
  authJwtSecret: "change_me_auth_secret_super_long_random_string"