apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: kafka
  ports:
  - name: kafka-port
    port: {{ .Values.kafka.port }}
    targetPort: {{ .Values.kafka.port }}
  - name: kafka-internal
    port: {{ .Values.kafka.internalPort }}
    targetPort: {{ .Values.kafka.internalPort }}
  type: ClusterIP